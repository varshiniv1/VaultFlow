app = "vaultflow-gateway"
primary_region = "iad"

[build]
  dockerfile = "vaultflow-gateway/Dockerfile"

[env]
  SERVICES_ACCOUNTS_URL      = "http://vaultflow-accounts.internal:8081"
  SERVICES_TRANSACTIONS_URL  = "http://vaultflow-transactions.internal:8082"
  SERVICES_NOTIFICATIONS_URL = "http://vaultflow-notifications.internal:8083"
  SERVICES_FRAUD_URL         = "http://vaultflow-fraud.internal:8084"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY = "0.0"
  SPRING_JPA_SHOWSQL = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/actuator/health"
  timeout = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
