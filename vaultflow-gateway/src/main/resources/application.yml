server:
  port: 8080

spring:
  application:
    name: vaultflow-gateway
jwt:
  secret: VmF1bHRGbG93U2VjcmV0S2V5MjAyNkZvckp3dEF1dGhlbnRpY2F0aW9uQW5kQXV0aG9yaXphdGlvbg==
  expiration-ms: 900000        # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days

groq:
  api:
    key: ${GROQ_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
