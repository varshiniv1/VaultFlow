server:
  port: 8080

spring:
  application:
    name: vaultflow-gateway
  cloud:
    gateway:
      routes:
        - id: accounts-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/accounts/**

        - id: transactions-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**

        - id: notifications-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/notifications/**

        - id: fraud-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/fraud/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
