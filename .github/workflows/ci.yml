name: CI — Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: |
          MVN=$(find ~/.m2/wrapper -name mvn -type f 2>/dev/null | head -1 || echo mvn)
          # Fall back to system Maven if wrapper not cached
          if command -v mvn &>/dev/null; then
            mvn compile -q --no-transfer-progress
          else
            $MVN compile -q --no-transfer-progress
          fi

      - name: Run tests
        run: |
          if command -v mvn &>/dev/null; then
            mvn test --no-transfer-progress
          fi
