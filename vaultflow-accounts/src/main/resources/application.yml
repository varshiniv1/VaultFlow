server:
  port: 8081

spring:
  application:
    name: vaultflow-accounts
  datasource:
    url: jdbc:postgresql://localhost:5441/accounts_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
